<!-- Dentro do modal admin, adicionei a nova seção -->
<div class="admin-secao">
  <h3>📅 Gerar escala por mês</h3>
  <p class="admin-aviso">Escolha um mês e clique para gerar automaticamente todas as quartas e sábados.</p>
  <div class="admin-row">
    <div class="admin-col">
      <span class="admin-label">Mês</span>
      <input class="admin-input" type="month" id="mes">
    </div>
    <button class="btn-acao btn-acao-verde" onclick="gerarMesSelecionado()">Gerar escala do mês</button>
  </div>
</div>

<div id="lista"></div>

<script>
// ===================== LISTAS DE IRMÃOS =====================
var todosBracos = [ "Eriton Oliveira","Daniel Fernandes","Ivo Julião","Pedro Macumbi",
  "Endrik Araújo","Renan Carvalho","Carlos Silva","Juscelino Alves",
  "Claudio Borges","Franklin Dantas","José Murilo",
  "Manoel Martins","Márcio Motta","Luiz Oliveira","Francisco Valério",
  "Caio Andrade","Felipe Santos","Rodrigo Albuquerque"
];

var palcoCombos = [
  ["Eriton Oliveira","Daniel Fernandes"],
  ["Ivo Julião","Pedro Macumbi"],
  ["Eriton Oliveira","Pedro Macumbi"],
  ["Ivo Julião","Daniel Fernandes"],
  ["Eriton Oliveira","Franklin Dantas"],
  ["Ivo Julião","Franklin Dantas"]
];
var microfoneVolantes = ["Endrik Araújo","Renan Carvalho","Carlos Silva","Juscelino Alves","Pedro Macumbi"];
var indicadores = ["Claudio Borges","Franklin Dantas","Carlos Silva","Juscelino Alves","José Murilo",
  "Manoel Martins","Pedro Macumbi","Eriton Oliveira","Márcio Motta","Luiz Oliveira",
  "Ivo Julião","Francisco Valério"
];
var audioRodizio = ["Caio Andrade","Felipe Santos"];
var videoRodizio = ["Daniel Fernandes","Rodrigo Albuquerque"];
var zoomRodizio  = ["Caio Andrade","Felipe Santos","Daniel Fernandes","Rodrigo Albuquerque"];

// ===================== RODÍZIO CORRIGIDO =====================
var idxP=0, idxM={v:0}, idxA={v:0}, idxV={v:0}, idxZ={v:0}, idxI={v:0};
var ultimoCombo = null;

function proximoCombo() {
  let tentativas = 0;
  let combo;
  do {
    combo = palcoCombos[idxP % palcoCombos.length];
    idxP++;
    tentativas++;
    if (tentativas > palcoCombos.length) break;
  } while (ultimoCombo && combo.some(n => ultimoCombo.includes(n)));
  ultimoCombo = combo;
  return combo;
}

// ===================== FUNÇÕES DE GERAÇÃO =====================
function gerarReunioes(mes, ano) {
  var list=[], d=new Date(ano,mes-1,1);
  while (d.getMonth()===mes-1) {
    if (d.getDay()===3) list.push({data:new Date(ano,mes-1,d.getDate(),19,0), tipo:"Quarta"});
    else if (d.getDay()===6) list.push({data:new Date(ano,mes-1,d.getDate(),18,30), tipo:"Sábado"});
    d.setDate(d.getDate()+1);
  }
  return list;
}

function rodizio(fila, idx, usados) {
  var t=0,c;
  do { c=fila[idx.v%fila.length]; idx.v++; t++; }
  while (usados.indexOf(c)>=0 && t<=fila.length*2);
  usados.push(c); return c;
}

function gerarMes(mes, ano) {
  var reunioes = gerarReunioes(mes, ano);
  var nomeMes = new Date(ano,mes-1,1).toLocaleString('pt-BR',{month:'long'});
  var bloco = document.createElement('div');
  bloco.className = 'mes-bloco';
  bloco.innerHTML =
    '<div class="mes-cab"><span class="mes-nome">'+nomeMes+' '+ano+'</span>'+
    '<span class="mes-resp">Responsável: Eriton Oliveira</span></div>';
  var grid = document.createElement('div');
  grid.className = 'reunioes-grid';

  reunioes.forEach(function(r) {
    var usados = [];
    var combo = proximoCombo();
    var coord = combo[0], ajud = combo[1];
    usados.push(coord, ajud);

    var mic1 = rodizio(microfoneVolantes, idxM, usados);
    var mic2 = rodizio(microfoneVolantes, idxM, usados);
    var audio= rodizio(audioRodizio,      idxA, usados);
    var video= rodizio(videoRodizio,      idxV, usados);
    var zoom = rodizio(zoomRodizio,       idxZ, usados);
    var aud  = rodizio(indicadores,       idxI, usados);
    var pat  = rodizio(indicadores,       idxI, usados);

    var c = document.createElement('div');
    c.className = 'card';
    c.innerHTML =
      '<div class="card-topo">'+
        '<span class="badge">'+r.tipo+'</span>'+
        '<span class="card-data">'+fmtData(r.data)+'</span>'+
        '<span class="card-hora">'+fmtHora(r.data)+'</span>'+
      '</div>'+
      linha('&#127963;','Palco',coord+' &amp; '+ajud)+
      linha('&#127908;','Mic. Volante',mic1+' &amp; '+mic2)+
      linha('&#127911;','Áudio',audio)+
      linha('&#127909;','Vídeo',video)+
      linha('&#127760;','Zoom',zoom)+
      linha('&#128101;','Indicadores','Auditório → '+aud+' &nbsp;|&nbsp; Pátio → '+pat);
    grid.appendChild(c);
  });

  bloco.appendChild(grid);
  document.getElementById('lista').appendChild(bloco);
}

function linha(ic, lb, val) {
  return '<div class="linha"><span class="linha-icone">'+ic+'</span>'+
    '<span class="linha-label">'+lb+'</span><span class="linha-nomes">'+val+'</span></div>';
}
function fmtData(d) {
  return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtHora(d) {
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

// ===================== NOVA FUNÇÃO =====================
function gerarMesSelecionado() {
  document.getElementById('lista').innerHTML='';
  idxP=0; idxM.v=0; idxA.v=0; idxV.v=0; idxZ.v=0; idxI.v=0;
  ultimoCombo=null;
  const mesAno = document.getElementById("mes").value; // formato YYYY-MM
  const [ano, mes] = mesAno.split("-");
  gerarMes(parseInt(mes), parseInt(ano));
}

// ===================== ESCALA PADRÃO =====================
function gerarEscala() {
  document.getElementById('lista').innerHTML='';
  idxP=0; idxM.v=0; idxA.v=0; idxV.v=0; idxZ.v=0; idxI.v=0;
  ultimoCombo=null;
  gerarMes(6,2026); gerarMes(7,2026); gerarMes(8,2026); gerarMes(9,2026
